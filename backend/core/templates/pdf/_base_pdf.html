<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>{% block title %}ESSIG-GEST{% endblock %}</title>
<style>
    @page {
        size: A4;
        margin: 2cm 1.5cm 2.5cm 1.5cm;

        @top-center {
            content: "ESSIG-GEST";
            font-family: Helvetica, Arial, sans-serif;
            font-size: 9pt;
            color: #666666;
        }

        @bottom-center {
            content: "Page " counter(page) " / " counter(pages);
            font-family: Helvetica, Arial, sans-serif;
            font-size: 8pt;
            color: #666666;
        }
    }

    body {
        font-family: Helvetica, Arial, sans-serif;
        font-size: 10pt;
        color: #1a1a1a;
        line-height: 1.4;
    }

    h1 {
        font-size: 16pt;
        margin-bottom: 0.3cm;
    }

    h2 {
        font-size: 13pt;
        margin-bottom: 0.2cm;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 0.5cm;
    }

    th, td {
        border: 1px solid #cccccc;
        padding: 0.15cm 0.25cm;
        text-align: left;
        font-size: 9pt;
    }

    th {
        background-color: #f0f0f0;
    }

    {% block extra_style %}{% endblock %}
</style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
